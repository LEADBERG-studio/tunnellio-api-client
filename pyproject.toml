[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnellio"
version = "0.1.6"
description = "CLI/helper for planning and launching Tunnellio SSH tunnels"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Tunnellio" }
]
dependencies = [
  "truststore>=0.9.1"
]

[project.scripts]
tunnellio = "tunnellio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
